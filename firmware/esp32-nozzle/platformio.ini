; FuelGuard ESP32 nozzle controller
; Build: pio run  |  Upload: pio run -t upload  |  Monitor: pio device monitor
;
; The same sources compile in the Arduino IDE as a single sketch: copy
; src/main.cpp + src/config.h into one .ino file and install the same
; libraries (ArduinoJson, Preferences are bundled with the ESP32 core).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
